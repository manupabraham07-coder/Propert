/* ---------- local, on-device storage (replaces the Claude-artifact storage API) ---------- */
window.storage = {
  get: function (key) {
    return new Promise(function (resolve, reject) {
      try {
        var v = localStorage.getItem(key);
        if (v === null) { reject(new Error("not found")); return; }
        resolve({ key: key, value: v, shared: false });
      } catch (e) { reject(e); }
    });
  },
  set: function (key, value) {
    return new Promise(function (resolve, reject) {
      try { localStorage.setItem(key, value); resolve({ key: key, value: value, shared: false }); }
      catch (e) { reject(e); }
    });
  },
  delete: function (key) {
    return new Promise(function (resolve, reject) {
      try { localStorage.removeItem(key); resolve({ key: key, deleted: true, shared: false }); }
      catch (e) { reject(e); }
    });
  },
  list: function (prefix) {
    return new Promise(function (resolve, reject) {
      try {
        var keys = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (!prefix || k.indexOf(prefix) === 0) keys.push(k);
        }
        resolve({ keys: keys, prefix: prefix, shared: false });
      } catch (e) { reject(e); }
    });
  },
};

function makeIcon(glyph) {
  return function Icon(props) {
    var size = props.size || 16;
    var color = props.color;
    var style = props.style || {};
    return React.createElement(
      "span",
      { className: props.className, style: Object.assign({ fontSize: size, lineHeight: 1, display: "inline-block", verticalAlign: "middle", color: color }, style) },
      glyph
    );
  };
}

function compressImage(file, maxW, quality) {
  maxW = maxW || 480;
  quality = quality || 0.6;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function computeStats(properties) {
  const now = new Date();
  const stats = { sale: 0, rent: 0, closed: 0, thisMonth: 0 };
  properties.forEach((p) => {
    if (p.purpose === "വാടക") stats.rent += 1;
    else stats.sale += 1;
    if (p.status === "വിറ്റു" || p.status === "വാടകയ്ക്ക് കൊടുത്തു") stats.closed += 1;
    if (p.createdAt) {
      const d = new Date(p.createdAt);
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) stats.thisMonth += 1;
    }
  });
  return stats;
}

function reminderStatus(p) {
  if (!p.followUpDate) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const fd = new Date(p.followUpDate);
  if (isNaN(fd.getTime())) return null;
  fd.setHours(0, 0, 0, 0);
  if (fd.getTime() < today.getTime()) return "overdue";
  if (fd.getTime() === today.getTime()) return "today";
  return "upcoming";
}

  const [brokerDetailId, setBrokerDetailId] = useState(null);
  const [showBackupReminder, setShowBackupReminder] = useState(false);

  const [brokers, setBrokers] = useState([]);

  const [brokerForm, setBrokerForm] = useState(emptyBrokerForm);
  const [editingBrokerId, setEditingBrokerId] = useState(null);
  const [savingBroker, setSavingBroker] = useState(false);
  const [confirmDeleteBroker, setConfirmDeleteBroker] = useState(null);

  const [restorePending, setRestorePending] = useState(null);
  const [restoring, setRestoring] = useState(false);

  const [filterType, setFilterType] = useState("എല്ലാം");
  const [filterPurpose, setFilterPurpose] = useState("എല്ലാം");
  const [sortBy, setSortBy] = useState("date_desc");
  const [remindersOnly, setRemindersOnly] = useState(false);
  const [showFilters, setShowFilters] = useState(false);

  useEffect(() => {
    loadAll();
    loadBrokers();
    const t1 = setTimeout(() => setSplashFading(true), 950);
    const t2 = setTimeout(() => setSplashVisible(false), 1300);
    try {
      const lastBackup = Number(localStorage.getItem("propertyLedgerLastBackupAt") || 0);
      const lastDismissed = Number(localStorage.getItem("propertyLedgerBackupReminderDismissedAt") || 0);
      const now = Date.now();
      const weekMs = 7 * 24 * 60 * 60 * 1000;
      const dayMs = 24 * 60 * 60 * 1000;
      if (now - lastBackup > weekMs && now - lastDismissed > dayMs) {
        setShowBackupReminder(true);
      }
    } catch (e) {
      // ignore
    }
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  useEffect(() => {
    if (!info) return;
    const t = setTimeout(() => setInfo(""), 3000);
    return () => clearTimeout(t);
  }, [info]);

  async function loadAll() {
    setLoading(true);
    setError("");
    try {
      const listed = await window.storage.list("property:", false);
      const keys = listed?.keys || [];
      const items = [];
      for (const k of keys) {
        try {
          const res = await window.storage.get(k, false);
          if (res?.value) items.push(JSON.parse(res.value));
        } catch (e) {
          // skip unreadable entry
        }
      }
      items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      setProperties(items);
    } catch (e) {
      setError("ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു.");
    } finally {
      setLoading(false);
    }
  }

  async function handlePhotoChange(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    try {
      const dataUrls = await Promise.all(files.map((f) => compressImage(f, 480, 0.6)));
      setForm((f) => ({ ...f, photos: [...(f.photos || []), ...dataUrls] }));
    } catch {
      setError("ഫോട്ടോ പ്രോസസ് ചെയ്യുന്നതിൽ പിശക്.");
    }
  }

  function removePhoto(index) {
    setForm((f) => ({ ...f, photos: (f.photos || []).filter((_, i) => i !== index) }));
  }

  async function handleDocumentChange(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    try {
      const items = [];
      for (const file of files) {
        const isImage = file.type.startsWith("image/");
        const dataUrl = isImage ? await compressImage(file, 1000, 0.7) : await readAsDataUrl(file);
        items.push({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: file.name || "ഡോക്യുമെന്റ്",
          dataUrl,
          isImage,
        });
      }
      setForm((f) => ({ ...f, documents: [...(f.documents || []), ...items] }));
    } catch {
      setError("ഡോക്യുമെന്റ് ചേർക്കുന്നതിൽ പിശക്.");
    }
  }

  function removeDocument(id) {
    setForm((f) => ({ ...f, documents: (f.documents || []).filter((d) => d.id !== id) }));
  }

  async function saveProperty() {
    if (!form.location.trim()) {
      setError("ലൊക്കേഷൻ നിർബന്ധമാണ്.");
      return;
    }
    setSaving(true);
    setError("");
    const id = editingId || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const { photo, ...rest } = form;
    const record = { ...rest, id, createdAt: form.createdAt || Date.now() };
    try {
      const result = await window.storage.set(`property:${id}`, JSON.stringify(record), false);
      if (!result) throw new Error("save failed");
      setProperties((prev) =>
        editingId ? prev.map((x) => (x.id === id ? record : x)) : [record, ...prev]
      );
      setForm(emptyForm);
      setEditingId(null);
      setShowForm(false);
    } catch (e) {
      setError("സേവ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു, വീണ്ടും ശ്രമിക്കുക.");
    } finally {
      setSaving(false);
    }
  }

  function openEdit(p) {
    setForm({ ...emptyForm, ...p, photos: getPhotos(p), documents: getDocuments(p) });
    setEditingId(p.id);
    setError("");
    setShowForm(true);
  }

  function openDetail(p) {
    setDetailId(p.id);
  }

  async function deleteProperty(id) {
    try {
      await window.storage.delete(`property:${id}`, false);
      setProperties((p) => p.filter((x) => x.id !== id));
    } catch {
      setError("ഡിലീറ്റ് ചെയ്യുന്നതിൽ പിശക്.");
    } finally {
      setConfirmDelete(null);
    }
  }

  async function loadBrokers() {
    try {
      const listed = await window.storage.list("broker:", false);
      const keys = listed?.keys || [];
      const items = [];
      for (const k of keys) {
        try {
          const res = await window.storage.get(k, false);
          if (res?.value) items.push(JSON.parse(res.value));
        } catch (e) {
          // skip unreadable entry
        }
      }
      items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      setBrokers(items);
    } catch (e) {
      setError("ബ്രോക്കർ ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു.");
    }
  }

  async function saveBroker() {
    if (!brokerForm.name.trim()) {
      setError("ബ്രോക്കറുടെ പേര് നിർബന്ധമാണ്.");
      return;
    }
    setSavingBroker(true);
    setError("");
    const id = editingBrokerId || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    const record = { ...brokerForm, id, createdAt: brokerForm.createdAt || Date.now() };
    try {
      const result = await window.storage.set(`broker:${id}`, JSON.stringify(record), false);
      if (!result) throw new Error("save failed");
      setBrokers((prev) =>
        editingBrokerId ? prev.map((x) => (x.id === id ? record : x)) : [record, ...prev]
      );
      setBrokerForm(emptyBrokerForm);
      setEditingBrokerId(null);
      setShowBrokerForm(false);
    } catch (e) {
      setError("സേവ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു, വീണ്ടും ശ്രമിക്കുക.");
    } finally {
      setSavingBroker(false);
    }
  }

  function openEditBroker(b) {
    setBrokerForm({ ...emptyBrokerForm, ...b });
    setEditingBrokerId(b.id);
    setError("");
    setShowBrokerForm(true);
  }

  function openBrokerDetail(b) {
    setBrokerDetailId(b.id);
  }

  async function deleteBroker(id) {
    try {
      await window.storage.delete(`broker:${id}`, false);
      setBrokers((b) => b.filter((x) => x.id !== id));
    } catch {
      setError("ഡിലീറ്റ് ചെയ്യുന്നതിൽ പിശക്.");
    } finally {
      setConfirmDeleteBroker(null);
    }
  }

  function brokerName(id) {
    const b = brokers.find((x) => x.id === id);
    return b ? b.name : "";
  }

  /* ---------- Backup (export all data as JSON) ---------- */
  function exportBackup() {
    try {
      const payload = {
        app: "property-ledger",
        backupVersion: 1,
        exportedAt: new Date().toISOString(),
        properties,
        brokers,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `property-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      try { localStorage.setItem("propertyLedgerLastBackupAt", String(Date.now())); } catch (e) {}
      setShowBackupReminder(false);
      setInfo("ബാക്കപ്പ് ഫയൽ ഡൗൺലോഡ് ചെയ്തു.");
    } catch (e) {
      setError("ബാക്കപ്പ് എടുക്കുന്നതിൽ പിശക് സംഭവിച്ചു.");
    }
  }

  function dismissBackupReminder() {
    try { localStorage.setItem("propertyLedgerBackupReminderDismissedAt", String(Date.now())); } catch (e) {}
    setShowBackupReminder(false);
  }

  /* ---------- Restore (pick a backup JSON file) ---------- */
  function triggerRestorePick() {
    backupInputRef.current?.click();
  }

  async function handleRestoreFileSelected(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const props = Array.isArray(data.properties) ? data.properties : [];
      const brks = Array.isArray(data.brokers) ? data.brokers : [];
      if (props.length === 0 && brks.length === 0) {
        throw new Error("empty");
      }
      setRestorePending({ properties: props, brokers: brks });
    } catch (err) {
      setError("ബാക്കപ്പ് ഫയൽ വായിക്കാൻ കഴിഞ്ഞില്ല. ശരിയായ ബാക്കപ്പ് (.json) ഫയൽ തിരഞ്ഞെടുക്കുക.");
    }
  }

  async function confirmRestore() {
    if (!restorePending) return;
    setRestoring(true);
    setError("");
    try {
      const existingProps = await window.storage.list("property:", false);
      for (const k of (existingProps?.keys || [])) {
        await window.storage.delete(k, false);
      }
      const existingBrokers = await window.storage.list("broker:", false);
      for (const k of (existingBrokers?.keys || [])) {
        await window.storage.delete(k, false);
      }
      for (const p of restorePending.properties) {
        if (p && p.id) await window.storage.set(`property:${p.id}`, JSON.stringify(p), false);
      }
      for (const b of restorePending.brokers) {
        if (b && b.id) await window.storage.set(`broker:${b.id}`, JSON.stringify(b), false);
      }
      await loadAll();
      await loadBrokers();
      setInfo("ബാക്കപ്പിൽ നിന്ന് ഡാറ്റ വിജയകരമായി റീസ്റ്റോർ ചെയ്തു.");
      setRestorePending(null);
    } catch (e) {
      setError("റീസ്റ്റോർ ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു.");
    } finally {
      setRestoring(false);
    }
  }

  function exportToExcel() {
    if (properties.length === 0) {
      setError("എക്സ്പോർട്ട് ചെയ്യാൻ ഡാറ്റ ഒന്നും ഇല്ല.");
      return;
    }
    try {
      const headers = [
        "നമ്പർ", "തരം", "വിഭാഗം", "സ്റ്റാറ്റസ്", "ലൊക്കേഷൻ", "ലാൻഡ്മാർക്ക്", "വില",
        "വിലപേശാം", "വാടക (മാസം)", "അഡ്വാൻസ്", "ഫർണിഷിംഗ്", "ലഭ്യമായ തീയതി",
        "സൈസ്", "സർവേ നമ്പർ", "റോഡ് വീതി", "സൗകര്യങ്ങൾ",
        "ഉടമയുടെ പേര്", "കോൺടാക്റ്റ്", "ബ്രോക്കർ", "കുറിപ്പുകൾ", "ചേർത്ത തീയതി",
      ];
      const dateStr = new Date().toISOString().slice(0, 10);
      const dataRows = properties
        .slice()
        .reverse()
        .map((p, i) => [
          i + 1,
          p.type || "",
          p.purpose || "",
          p.status || "",
          p.location || "",
          p.landmark || "",
          p.purpose === "വാടക" ? "" : (p.price || ""),

          p.furnishing || "",
          p.availableFrom || "",
          p.size || "",
          p.surveyNumber || "",
          p.roadWidth || "",
          (p.amenities || []).join(", "),
          p.ownerName || "",
          p.ownerContact || "",
          brokerName(p.brokerId),
          p.notes || "",
          p.createdAt ? new Date(p.createdAt).toLocaleDateString("ml-IN") : "",

      const aoa = [
        ["പ്രോപ്പർട്ടി രജിസ്റ്റർ"],

        [],
        headers,
        ...dataRows,
      ];

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const lastCol = headers.length - 1;

      ws["!merges"] = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: lastCol } },
        { s: { r: 1, c: 0 }, e: { r: 1, c: lastCol } },
      ];

      ws["!cols"] = [
        { wch: 5 }, { wch: 9 }, { wch: 9 }, { wch: 10 }, { wch: 18 }, { wch: 14 }, { wch: 10 },
        { wch: 9 }, { wch: 10 }, { wch: 10 }, { wch: 11 }, { wch: 11 },
        { wch: 11 }, { wch: 10 }, { wch: 9 }, { wch: 18 },
        { wch: 14 }, { wch: 12 }, { wch: 14 }, { wch: 20 }, { wch: 11 },
      ];

      // A4 print setup: landscape, fit to one page wide, small margins
      ws["!pageSetup"] = { paperSize: 9, orientation: "landscape", fitToWidth: 1, fitToHeight: 0, scale: 100 };
      ws["!fitToPage"] = true;
      ws["!margins"] = { left: 0.35, right: 0.35, top: 0.5, bottom: 0.4, header: 0.2, footer: 0.2 };
      ws["!printHeader"] = true;

      const wb = XLSX.utils.book_new();
      wb.Workbook = wb.Workbook || {};
      wb.Workbook.Sheets = [{ Hidden: 0 }];
      XLSX.utils.book_append_sheet(wb, ws, "പ്രോപ്പർട്ടികൾ");

      if (brokers.length > 0) {
        const brokerHeaders = ["നമ്പർ", "പേര്", "കോൺടാക്റ്റ്", "ഏജൻസി", "പ്രവർത്തന മേഖല", "കമ്മീഷൻ", "കുറിപ്പുകൾ"];
        const brokerRows = brokers
          .slice()
          .reverse()
          .map((b, i) => [i + 1, b.name || "", b.contact || "", b.agency || "", b.area || "", b.commission || "", b.notes || ""]);
        const brokerAoa = [
          ["ബ്രോക്കർമാർ"],
          [`തീയതി: ${dateStr}    ആകെ എൻട്രികൾ: ${brokers.length}`],
          [],
          brokerHeaders,
          ...brokerRows,
        ];
        const bws = XLSX.utils.aoa_to_sheet(brokerAoa);
        const bLastCol = brokerHeaders.length - 1;
        bws["!merges"] = [
          { s: { r: 0, c: 0 }, e: { r: 0, c: bLastCol } },
          { s: { r: 1, c: 0 }, e: { r: 1, c: bLastCol } },
        ];
        bws["!cols"] = [{ wch: 6 }, { wch: 20 }, { wch: 16 }, { wch: 20 }, { wch: 20 }, { wch: 14 }, { wch: 26 }];
        bws["!pageSetup"] = { paperSize: 9, orientation: "landscape", fitToWidth: 1, fitToHeight: 0, scale: 100 };
        bws["!fitToPage"] = true;
        bws["!margins"] = { left: 0.35, right: 0.35, top: 0.5, bottom: 0.4, header: 0.2, footer: 0.2 };
        XLSX.utils.book_append_sheet(wb, bws, "ബ്രോക്കർമാർ");
      }

      XLSX.writeFile(wb, `property-ledger-${dateStr}.xlsx`);
    } catch (e) {
      setError("എക്സ്പോർട്ട് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു.");
    }
  }

  const filtered = properties
    .filter((p) => {
      const q = query.trim().toLowerCase();
      if (q && ![p.location, p.type, p.purpose, p.status, p.ownerName, p.price, p.rentAmount, p.landmark, p.surveyNumber, brokerName(p.brokerId)].join(" ").toLowerCase().includes(q)) return false;
      if (filterType !== "എല്ലാം" && p.type !== filterType) return false;
      if (filterPurpose !== "എല്ലാം" && p.purpose !== filterPurpose) return false;
      if (remindersOnly && !reminderStatus(p)) return false;
      return true;
    })
    .sort((a, b) => {
      if (sortBy === "date_asc") return (a.createdAt || 0) - (b.createdAt || 0);
      if (sortBy === "followup") {
        const fa = a.followUpDate ? new Date(a.followUpDate).getTime() : Infinity;
        const fb = b.followUpDate ? new Date(b.followUpDate).getTime() : Infinity;
        if (fa !== fb) return fa - fb;
        return (b.createdAt || 0) - (a.createdAt || 0);
      }
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

  const filteredBrokers = brokers.filter((b) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return [b.name, b.contact, b.agency, b.area].join(" ").toLowerCase().includes(q);
  });

  const detailProperty = detailId ? properties.find((x) => x.id === detailId) : null;
  const brokerDetailBroker = brokerDetailId ? brokers.find((x) => x.id === brokerDetailId) : null;
  const brokerDetailProperties = brokerDetailBroker ? properties.filter((p) => p.brokerId === brokerDetailBroker.id) : [];

  return (
    <div className="font-body" style={{ minHeight: "100vh", background: "var(--paper)", color: "var(--ink)" }}>
      <style>{FONT_STYLE}</style>

      {splashVisible && (
        <div

          </div>
          <div className="splash-sub" style={{ color: "rgba(244,241,228,0.65)", fontSize: 12.5 }}>
            നിങ്ങളുടെ സ്വകാര്യ പ്രോപ്പർട്ടി ലെഡ്ജർ
          </div>
        </div>
      )}

      {/* Header */}
      <div style={{ background: "var(--teal-dark)", color: "#F4F1E4", padding: "22px 18px 26px", position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", inset: 0, backgroundImage: "repeating-linear-gradient(transparent, transparent 27px, rgba(244,241,228,0.06) 28px)" }} />
        <div style={{ position: "relative" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <LogoMark size={34} ring={false} />
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, opacity: 0.75, fontSize: 11, letterSpacing: "0.14em" }}>
                <span>PROPERTY LEDGER</span>
              </div>
              <h1 className="font-display" style={{ fontSize: 22, fontWeight: 700, margin: 0 }}>പ്രോപ്പർട്ടി രജിസ്റ്റർ</h1>
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, gap: 8, flexWrap: "wrap" }}>
            <p style={{ margin: 0, fontSize: 13, opacity: 0.8 }}>
              {view === "properties" ? `ആകെ എൻട്രികൾ: ${properties.length}` : `ആകെ ബ്രോക്കർമാർ: ${brokers.length}`}

            border: view === "properties" ? "1.5px solid var(--teal)" : "1.5px solid var(--paper-line)",

          </div>

          {getPhotos(detailProperty).length > 0 ? (
            <div style={{ display: "flex", overflowX: "auto", scrollSnapType: "x mandatory" }}>
              {getPhotos(detailProperty).map((ph, i) => (
                <img key={i} src={ph} alt="" style={{ width: "100%", flex: "0 0 100%", height: 230, objectFit: "cover", scrollSnapAlign: "start" }} />
              ))}
            </div>
          ) : (
            <div style={{ width: "100%", height: 160, background: "#fff", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <ImageIcon size={30} color="var(--paper-line)" />
            </div>
          )}

          <div style={{ padding: "14px 16px 90px", display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 12, fontWeight: 700, color: "var(--teal)", background: "#E7EFEB", borderRadius: 5, padding: "2px 8px" }}>{detailProperty.type}</span>
              <span style={{
                fontSize: 12, fontWeight: 700, color: detailProperty.purpose === "വാടക" ? "#B8791A" : "var(--teal)",
                background: detailProperty.purpose === "വാടക" ? "#FBF0DD" : "#E7EFEB", borderRadius: 5, padding: "2px 8px",
              }}>{detailProperty.purpose}</span>
              <span style={{
                fontSize: 12, fontWeight: 700, color: STATUS_COLOR[detailProperty.status] || "var(--stamp)",
                border: `1.5px solid ${STATUS_COLOR[detailProperty.status] || "var(--stamp)"}`, borderRadius: 5, padding: "2px 8px",
              }}>{detailProperty.status}</span>
            </div>

            {reminderStatus(detailProperty) && (
              <div style={{
                display: "flex", alignItems: "center", gap: 5, fontSize: 12.5, fontWeight: 700, width: "fit-content",
                color: reminderStatus(detailProperty) === "upcoming" ? "var(--teal-dark)" : "#fff",
                background: reminderStatus(detailProperty) === "overdue" ? "var(--stamp)" : reminderStatus(detailProperty) === "today" ? "#B8791A" : "#E7EFEB",
                borderRadius: 6, padding: "4px 10px",
              }}>
                <Bell size={12} />
                {reminderStatus(detailProperty) === "overdue" ? "ഫോളോ-അപ്പ് വൈകി" : reminderStatus(detailProperty) === "today" ? "ഇന്ന് ഫോളോ-അപ്പ്" : `ഫോളോ-അപ്പ്: ${detailProperty.followUpDate}`}
              </div>
            )}

            <div style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 12, padding: "14px" }}>
              {detailProperty.purpose === "വാടക" ? (
                <>
                  {detailProperty.rentAmount && <DetailRow label="വാടക" value={`\u20B9${detailProperty.rentAmount}/മാസം`} />}
                  {detailProperty.deposit && <DetailRow label="അഡ്വാൻസ്/ഡെപ്പോസിറ്റ്" value={detailProperty.deposit} />}
                  {detailProperty.furnishing && <DetailRow label="ഫർണിഷിംഗ്" value={detailProperty.furnishing} />}
                  {detailProperty.availableFrom && <DetailRow label="ലഭ്യമായ തീയതി" value={detailProperty.availableFrom} />}
                </>
              ) : (
                detailProperty.price && <DetailRow label="വില" value={`\u20B9${detailProperty.price}${detailProperty.negotiable ? " (വിലപേശാം)" : ""}`} />
              )}
              {detailProperty.size && <DetailRow label="സൈസ്" value={detailProperty.size} />}
              {detailProperty.surveyNumber && <DetailRow label="സർവേ നമ്പർ" value={detailProperty.surveyNumber} />}
              {detailProperty.landmark && <DetailRow label="അടുത്തുള്ള സ്ഥലങ്ങൾ" value={detailProperty.landmark} />}
              {detailProperty.roadWidth && <DetailRow label="റോഡ് വീതി" value={detailProperty.roadWidth} />}
            </div>

            {detailProperty.amenities && detailProperty.amenities.length > 0 && (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {detailProperty.amenities.map((a) => (
                  <span key={a} style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 20, padding: "4px 12px", fontSize: 12.5 }}>{a}</span>
                ))}
              </div>
            )}

            {(detailProperty.ownerName || detailProperty.ownerContact) && (
              <div style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 12, padding: "14px" }}>
                {detailProperty.ownerName && <DetailRow label="ഉടമയുടെ പേര്" value={detailProperty.ownerName} />}
                {detailProperty.ownerContact && <DetailRow label="കോൺടാക്റ്റ്" value={detailProperty.ownerContact} />}
                {detailProperty.ownerContact && (
                  <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                    <a href={`tel:${detailProperty.ownerContact}`} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "var(--teal)", color: "#fff", borderRadius: 8, padding: "8px 0", fontSize: 13, textDecoration: "none" }}>
                      <CallIcon size={13} /> കോൾ ചെയ്യുക
                    </a>
                    <a href={`https://wa.me/${detailProperty.ownerContact.replace(/\D/g, "")}`} target="_blank" rel="noreferrer" style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "#25A366", color: "#fff", borderRadius: 8, padding: "8px 0", fontSize: 13, textDecoration: "none" }}>
                      <WhatsIcon size={13} /> WhatsApp
                    </a>
                  </div>
                )}
              </div>
            )}

            {detailProperty.brokerId && brokerName(detailProperty.brokerId) && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: "var(--teal)" }}>
                <Briefcase size={14} /> {brokerName(detailProperty.brokerId)}
              </div>
            )}

            {detailProperty.notes && (
              <div style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 12, padding: "12px 14px", fontSize: 13.5, fontStyle: "italic" }}>
                “{detailProperty.notes}”
              </div>
            )}

            {getDocuments(detailProperty).length > 0 && (
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-soft)", marginBottom: 6 }}>ഡോക്യുമെന്റുകൾ</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {getDocuments(detailProperty).map((d) => (
                    <a
                      key={d.id}
                      href={d.dataUrl}
                      target="_blank"
                      rel="noreferrer"
                      style={{ display: "flex", alignItems: "center", gap: 8, background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 8, padding: "9px 12px", textDecoration: "none", color: "var(--ink)" }}
                    >
                      {d.isImage ? (
                        <img src={d.dataUrl} alt="" style={{ width: 30, height: 30, objectFit: "cover", borderRadius: 4, flexShrink: 0 }} />
                      ) : (
                        <Paperclip size={16} color="var(--ink-soft)" />
                      )}
                      <span style={{ fontSize: 13, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.name}</span>
                    </a>
                  ))}
                </div>
              </div>
            )}

            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <button
                onClick={() => { openEdit(detailProperty); }}
                style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "var(--teal)", color: "#fff", border: "none", borderRadius: 9, padding: "11px 0", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}
              >
                <Pencil size={14} /> എഡിറ്റ് ചെയ്യുക
              </button>
              <button
                onClick={() => { setConfirmDelete(detailProperty.id); setDetailId(null); }}
                style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "#fff", color: "var(--stamp)", border: "1.5px solid var(--stamp)", borderRadius: 9, padding: "11px 16px", fontSize: 14, cursor: "pointer", fontFamily: "inherit" }}
              >
                <Trash2 size={14} />
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Broker Detail View */}
      {brokerDetailBroker && (
        <div style={{ position: "fixed", inset: 0, background: "var(--paper)", zIndex: 70, overflowY: "auto" }}>
          <div style={{ background: "var(--teal-dark)", color: "#F4F1E4", padding: "16px 14px", display: "flex", alignItems: "center", gap: 10, position: "sticky", top: 0, zIndex: 5 }}>
            <button onClick={() => setBrokerDetailId(null)} style={{ border: "none", background: "rgba(244,241,228,0.14)", color: "#F4F1E4", borderRadius: 8, padding: 7, cursor: "pointer", display: "flex" }} aria-label="തിരികെ പോകുക">
              <ArrowLeft size={16} />
            </button>
            <div className="font-display" style={{ fontSize: 16, fontWeight: 700, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {brokerDetailBroker.name}
            </div>
            <button onClick={() => { openEditBroker(brokerDetailBroker); setBrokerDetailId(null); }} style={{ border: "none", background: "rgba(244,241,228,0.14)", color: "#F4F1E4", borderRadius: 8, padding: 7, cursor: "pointer", display: "flex" }} aria-label="എഡിറ്റ് ചെയ്യുക">
              <Pencil size={16} />
            </button>
          </div>

          <div style={{ padding: "14px 16px 90px", display: "flex", flexDirection: "column", gap: 12 }}>
            <div style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 12, padding: "14px" }}>
              {brokerDetailBroker.agency && <DetailRow label="ഏജൻസി" value={brokerDetailBroker.agency} />}
              {brokerDetailBroker.contact && <DetailRow label="കോൺടാക്റ്റ്" value={brokerDetailBroker.contact} />}
              {brokerDetailBroker.area && <DetailRow label="പ്രവർത്തന മേഖല" value={brokerDetailBroker.area} />}
              {brokerDetailBroker.commission && <DetailRow label="കമ്മീഷൻ" value={brokerDetailBroker.commission} />}
            </div>

            {brokerDetailBroker.contact && (
              <div style={{ display: "flex", gap: 8 }}>
                <a href={`tel:${brokerDetailBroker.contact}`} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "var(--teal)", color: "#fff", borderRadius: 8, padding: "9px 0", fontSize: 13, textDecoration: "none" }}>
                  <CallIcon size={13} /> കോൾ ചെയ്യുക
                </a>
                <a href={`https://wa.me/${brokerDetailBroker.contact.replace(/\D/g, "")}`} target="_blank" rel="noreferrer" style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, background: "#25A366", color: "#fff", borderRadius: 8, padding: "9px 0", fontSize: 13, textDecoration: "none" }}>
                  <WhatsIcon size={13} /> WhatsApp
                </a>
              </div>
            )}

            {brokerDetailBroker.notes && (
              <div style={{ background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 12, padding: "12px 14px", fontSize: 13.5, fontStyle: "italic" }}>
                “{brokerDetailBroker.notes}”
              </div>
            )}

            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-soft)", marginBottom: 8 }}>
                ഈ ബ്രോക്കർ വഴിയുള്ള പ്രോപ്പർട്ടികൾ ({brokerDetailProperties.length})
              </div>
              {brokerDetailProperties.length === 0 ? (
                <div style={{ fontSize: 13, color: "var(--ink-soft)", background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 10, padding: "16px", textAlign: "center" }}>
                  ഇതുവരെ പ്രോപ്പർട്ടികളൊന്നും ഈ ബ്രോക്കർ വഴി ചേർത്തിട്ടില്ല
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {brokerDetailProperties.map((p) => (
                    <div
                      key={p.id}
                      onClick={() => { setBrokerDetailId(null); setDetailId(p.id); }}
                      style={{ display: "flex", alignItems: "center", gap: 10, background: "#fff", border: "1px solid var(--paper-line)", borderRadius: 10, padding: "9px 10px", cursor: "pointer" }}
                    >
                      {getPhotos(p).length > 0 ? (
                        <img src={getPhotos(p)[0]} alt="" style={{ width: 48, height: 48, objectFit: "cover", borderRadius: 6, flexShrink: 0 }} />
                      ) : (
                        <div style={{ width: 48, height: 48, borderRadius: 6, background: "var(--paper)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                          <ImageIcon size={16} color="var(--paper-line)" />
                        </div>
                      )}
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 13.5, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.location}</div>
                        <div style={{ fontSize: 12, color: "var(--ink-soft)" }}>
                          {p.type} · {p.purpose === "വാടക" ? (p.rentAmount ? `\u20B9${p.rentAmount}/മാസം` : "വാടക") : (p.price ? `\u20B9${p.price}` : "വില്പന")}
                        </div>
                      </div>
                      <span style={{
                        fontSize: 10, fontWeight: 700, color: STATUS_COLOR[p.status] || "var(--stamp)",
                        border: `1.5px solid ${STATUS_COLOR[p.status] || "var(--stamp)"}`, borderRadius: 5, padding: "1px 6px", whiteSpace: "nowrap",
                      }}>
                        {p.status}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const labelStyle = { display: "block", fontSize: 12, color: "var(--ink-soft)", marginBottom: 5, fontWeight: 700 };

function DetailRow({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "6px 0", borderBottom: "1px dashed var(--paper-line)" }}>
      <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>{label}</span>
      <span style={{ fontSize: 13.5, fontWeight: 700, textAlign: "right" }}>{value}</span>
    </div>
  );
}

function Field({ label, value, onChange, placeholder, type = "text", inputMode }) {
  return (
    <div>
      <label style={labelStyle}>{label}</label>
      <input
        type={type}
        inputMode={inputMode}
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        style={{
          width: "100%", border: "1px solid var(--paper-line)", borderRadius: 8, padding: "10px 12px",
          fontSize: 14, background: "#fff", color: "var(--ink)", fontFamily: "inherit", outline: "none",
        }}
      />
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(React.createElement(PropertyLedger));
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
